[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "egis-agentkit-framework"
version = "0.1.0"
description = "Enterprise definitions and adapters for the native AgentScope service"
requires-python = ">=3.11"
dependencies = [
  "agentscope[service,storage-sql]>=2.0.10,<2.1",
  "asyncpg>=0.30", "httpx>=0.28,<1", "PyYAML>=6", "PyJWT[crypto]>=2.10,<3", "packaging>=24",
]

[project.optional-dependencies]
cluster = ["aiokafka>=0.12,<1"]
memory = ["agentscope[memory-reme]>=2.0.10,<2.1", "reme-ai==0.4.0.6"]
test = ["pytest>=8", "pytest-asyncio>=0.25", "aiosqlite>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/egis_agentkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv.sources]
agentscope = { path = "../../harness/agentscope", editable = true }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
