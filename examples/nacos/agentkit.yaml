# Data ID: agentkit.yaml。部署前按当前 namespace 的生效配置核对以下示例值。
# 环境变量字段保存部署密钥名；实际密钥由部署系统注入。
agentkit:
  revision: 1
  agent:
    catalog:
      defaultPageSize: 50
      maxPageSize: 100
      maxQueryLength: 500
      maxCursorLength: 2048
    personal:
      documents:
        templates:
          agent: agent.md
          soul: soul.md
          user: user.md
        maxBytes: 64000
      memory:
        isEnabled: false
        topK: 5
    remote:
      request:
        maxBytes: 1048576
        maxProgressCharacters: 2000
      callback:
        publicBaseUrl: null
        publicBaseUrlEnv: null
        maxBytes: 1048576
        maxClockSkewSeconds: 300
        minSecretBytes: 32
        pollSeconds: 1.0
      timeout:
        defaultSeconds: 60.0
        maxSeconds: 300.0
        cancelSeconds: 1.0
        websocketCloseSeconds: 0.5
        stopSeconds: 0.75
      retry:
        defaultRetries: 1
        maxAttempts: 4
        backoffSeconds: 0.1
  team:
    invite:
      maxMembers: 16
      maxRequestIdLength: 128
    roster:
      maxMembers: 20
  skill:
    archive:
      maxBytes: 52428799
      maxExpandedBytes: null
    import:
      leaseSeconds: 90.0
      maxAttempts: 3
      pollSeconds: 2.0
      retryBackoffSeconds: 5.0
      maxRetryDelaySeconds: 60.0
      listLimit: 100
  session:
    permissions:
      defaultMode: bypass
      allowedModes:
      - default
      - accept_edits
      - explore
      - bypass
    composer:
      defaultPageSize: 10
      maxPageSize: 10
      candidateBatchSize: 50
      maxQueryLength: 500
      maxCursorLength: 2048
    listing:
      maxSessions: 200
    naming:
      defaultName: 新对话
      maxLength: 80
      createMaxLength: 200
    feedback:
      defaultPageSize: 50
      maxPageSize: 100
      maxCommentLength: 4000
      maxSnapshotChars: 20000
    branch:
      maxMessages: 2000
      nameSuffix: ' · 分支'
  connector:
    oauth:
      credentialKeyEnv: AGENTKIT_MCP_CREDENTIAL_KEY
      redirectUri: null
      redirectUriEnv: null
      timeoutSeconds: 10.0
      stateLifetimeSeconds: 600.0
      refreshWindowSeconds: 15.0
      tokenLifetimeSeconds: 3600
      maxTokenLifetimeSeconds: 31536000
  tool:
    defaults:
      registeredIds: null
  access:
    allowPrivateSelfUse: true
    allowPersonalSelfUse: true
  user:
    identity:
      mode: jwt
      issuer: https://identity.example.com
      audience: egis-agentkit
      algorithm: RS256
      jwksUrl: https://identity.example.com/.well-known/jwks.json
      signingSecretEnv: AGENTKIT_JWT_SECRET
      demoPasswordEnv: AGENTKIT_DEMO_PASSWORD
      jwtLifetimeSeconds: 3600
      jwtClockSkewSeconds: 10.0
      jwtMaxTokenLength: 16384
      jwtMinSigningSecretLength: 32
      jwksCacheSeconds: 300
      jwksTimeoutSeconds: 10.0
      demoMinPasswordLength: 16
  project:
    defaults:
      name: 默认项目
      maxNameLength: 128
    context:
      maxFiles: 50
      maxDirectories: 200
    changes:
      defaultPageSize: 50
      maxPageSize: 100
      writingTools: [Write, Edit, Bash, PowerShell, CreateDemoReport]
    upload:
      maxBytes: 20971520
    scan:
      maxDepth: 32
      maxEntries: 10000
      maxPathBytes: 2048
      maxTotalBytes: 209715200
      readChunkBytes: 1048576
    preview:
      cache:
        isEnabled: true
        root: var/cache/document-preview
        ttlSeconds: 86400
        maxEntries: 128
        maxTotalBytes: 536870912
        rendererRevision: 1
      # 部署环境可配置安装好的中英文字体路径；不要依赖临时 HOME 下的用户字体。
      fontDirectories: []
      fontConfigFile: null
      reference:
        maxCount: 4
        maxTotalBytes: 1048576
        maxImageBytes: 262144
        maxImagePixels: 1500000
        maxImageEdge: 1600
        maxRegions: 8
        minRegionPixels: 5
        maxExcerptChars: 8000
        maxNoteChars: 500
        captureTimeoutMs: 15000
        jpegQuality: 0.85
        jpegMinQuality: 0.25
        jpegQualityStep: 0.15
      timeoutSeconds: 45.0
      maxBytes: 20971520
      maxConcurrent: 2
      maxPending: 4
    workbook:
      maxBytes: 20971520
      maxReferenceCells: 2000
      maxEntries: 1000
      maxEntryBytes: 20971520
      maxExpandedBytes: 52428800
    presentation:
      maxBytes: 20971520
      maxEntries: 5000
      maxEntryBytes: 20971520
      maxExpandedBytes: 104857600
      maxSlides: 200
      maxTitleChars: 120
      thumbnailWidth: 144
      maxThumbnailPixels: 65536
      thumbnailConcurrency: 2
    delivery:
      maxEntries: 10000
      maxTotalBytes: 209715200
    download:
      secretEnv: AGENTKIT_DOWNLOAD_SECRET
      minSecretLength: 32
  workspace:
    runtime:
      root: /srv/agentkit/workspace
      mode: local
      opensandbox:
        domain: 127.0.0.1:8090
        hostRoot: /srv/agentkit/workspace
        apiKeyEnv: OPEN_SANDBOX_API_KEY
        protocol: http
        image: python:3.11-slim
        useServerProxy: true
        inputsReadOnly: true
        requestTimeoutSeconds: 600
        readyTimeoutSeconds: 60
        timeoutSeconds: 3600
        bootstrapTimeoutSeconds: 600
        ttlSeconds: 900
        sweepIntervalSeconds: 60
        keepaliveIntervalSeconds: 60
        gatewayPort: 5600
        gatewayTmpDir: /dev/shm
        maxSkillBytes: 52428800
        env: {}
        resource: {cpu: '1', memory: 1Gi}
        entrypoint: [tail, '-f', /dev/null]
        extraPip: [docstring-parser, jinja2, aiofiles, python-frontmatter, tree-sitter, tree-sitter-bash, pypdf]
  model:
    catalog:
      models:
      - key: company
        displayName: Company model
        model: company-model
        credentialType: openai_credential
        modelClass: openai_chat
        baseUrl: https://model.example.com/v1
        apiKeyEnv: AGENTKIT_MODEL_API_KEY
        parameters: {}
    selection:
      defaultKey: company
      allowOverride: true
      allowedKeys:
      - company
  client:
    postgres:
      connection:
        urlEnv: AGENTKIT_DATABASE_URL
      pool:
        size: 10
        maxOverflow: 10
    kafka:
      connection:
        deploymentMode: standalone
        bootstrapServers:
        - 127.0.0.1:9092
        topicPrefix: egis-agentkit
        consumerGroup: egis-agentkit-wakeup-v1
      topics:
        partitions: 8
        replicationFactor: 1
      transport:
        bufferSize: 256
        startupTimeoutSeconds: 45.0
        pollTimeoutMilliseconds: 200
        fullBufferBackoffSeconds: 0.05
        retryBackoffSeconds: 0.5
        expirySweepSeconds: 60.0
        partitionFetchMaxBytes: 1048576
        fetchMaxBytes: 4194304
      broadcast:
        inlineMaxBytes: 524288
        maxBytes: 33554432
        maxKeyBytes: 65536
        payloadTtlSeconds: 3600
        storageTimeoutSeconds: 30.0
    nacos:
      refresh:
        intervalSeconds: 10.0
        failureIntervalSeconds: 10.0
