# Data ID: agentkit.yaml。部署前按当前 namespace 的生效配置核对以下示例值。
# 环境变量字段保存部署密钥名；实际密钥由部署系统注入。
agentkit:
  revision: 1
  agent:
    catalog:
      defaultPageSize: 10
      maxPageSize: 100
      maxQueryLength: 500
      maxCursorLength: 2048
    personal:
      documents:
        templates:
          agent: agent.md
          soul: soul.md
          user: user.md
        maxBytes: 64000
    remote:
      request:
        maxBytes: 1048576
        maxProgressCharacters: 2000
      callback:
        publicBaseUrl: null
        publicBaseUrlEnv: null
        maxBytes: 1048576
        maxClockSkewSeconds: 300
        minSecretBytes: 32
        pollSeconds: 1.0
      timeout:
        defaultSeconds: 60.0
        maxSeconds: 300.0
        cancelSeconds: 1.0
        websocketCloseSeconds: 0.5
        stopSeconds: 0.75
      retry:
        defaultRetries: 1
        maxAttempts: 4
        backoffSeconds: 0.1
  team:
    invite:
      maxMembers: 16
      maxRequestIdLength: 128
    roster:
      maxMembers: 20
  skill:
    catalog:
      defaultPageSize: 10
      maxPageSize: 100
      maxQueryLength: 500
      maxCursorLength: 2048
    storage:
      root: /mnt/company-nas/agentkit/skill-uploads
    archive:
      maxBytes: 52428799
      maxExpandedBytes: null
    avatar:
      enabled: true
      modelKey: null
      timeoutSeconds: 45
    import:
      leaseSeconds: 90.0
      maxAttempts: 3
      pollSeconds: 2.0
      retryBackoffSeconds: 5.0
      maxRetryDelaySeconds: 60.0
      listLimit: 100
      approvalBatchLimit: 50
  session:
    steering:
      maxBatchSize: 20
      maxMessageBytes: 1048576
      maxTextLength: 32000
    permissions:
      defaultMode: bypass
      allowedModes:
      - default
      - accept_edits
      - explore
      - bypass
    composer:
      defaultPageSize: 10
      maxPageSize: 10
      candidateBatchSize: 50
      maxQueryLength: 500
      maxCursorLength: 2048
    listing:
      maxSessions: 200
    naming:
      defaultName: 新对话
      maxLength: 80
      createMaxLength: 200
    feedback:
      defaultPageSize: 50
      maxPageSize: 100
      maxCommentLength: 4000
      maxSnapshotChars: 20000
    branch:
      maxMessages: 2000
      nameSuffix: ' · 分支'
  connector:
    catalog:
      defaultPageSize: 10
      maxPageSize: 100
      maxQueryLength: 500
      maxCursorLength: 2048
    oauth:
      credentialKeyEnv: AGENTKIT_MCP_CREDENTIAL_KEY
      redirectUri: null
      redirectUriEnv: null
      timeoutSeconds: 10.0
      stateLifetimeSeconds: 600.0
      refreshWindowSeconds: 15.0
      tokenLifetimeSeconds: 3600
      maxTokenLifetimeSeconds: 31536000
  tool:
    catalog:
      defaultPageSize: 10
      maxPageSize: 100
      maxQueryLength: 500
      maxCursorLength: 2048
    defaults:
      registeredIds: null
    knowledgeBase:
      # 完整 SSE POST /query 地址；配置后可在工具目录选用，个人助理勾选后装配。
      queryUrl: null
      timeoutSeconds: 1800.0
  access:
    companyGroupId: company
    companyGroupName: 公司组
    allowPrivateSelfUse: true
    allowPersonalSelfUse: true
  user:
    identity:
      mode: jwt
      issuer: https://identity.example.com
      audience: egis-agentkit
      algorithm: RS256
      jwksUrl: https://identity.example.com/.well-known/jwks.json
      jwtClockSkewSeconds: 10.0
      jwtMaxTokenLength: 16384
      jwksCacheSeconds: 300
      jwksTimeoutSeconds: 10.0
  project:
    memory:
      isEnabled: true
      topK: 5
    defaults:
      name: 默认项目
      maxNameLength: 128
    context:
      maxFiles: 50
      maxDirectories: 200
    changes:
      defaultPageSize: 50
      maxPageSize: 100
      writingTools: [Write, Edit, Bash, PowerShell, CreateDemoReport]
    upload:
      maxBytes: 20971520
    scan:
      maxDepth: 32
      maxEntries: 10000
      maxPathBytes: 2048
      maxTotalBytes: 209715200
      readChunkBytes: 1048576
    preview:
      cache:
        isEnabled: true
        root: var/cache/document-preview
        ttlSeconds: 86400
        maxEntries: 128
        maxTotalBytes: 536870912
        rendererRevision: 1
      # 部署环境可配置安装好的中英文字体路径；不要依赖临时 HOME 下的用户字体。
      fontDirectories: []
      fontConfigFile: null
      reference:
        maxCount: 4
        maxTotalBytes: 1048576
        maxImageBytes: 262144
        maxImagePixels: 1500000
        maxImageEdge: 1600
        maxRegions: 8
        minRegionPixels: 5
        maxExcerptChars: 8000
        maxNoteChars: 500
        captureTimeoutMs: 15000
        jpegQuality: 0.85
        jpegMinQuality: 0.25
        jpegQualityStep: 0.15
      timeoutSeconds: 45.0
      maxBytes: 20971520
      maxConcurrent: 2
      maxPending: 4
    workbook:
      maxBytes: 20971520
      maxReferenceCells: 2000
      maxEntries: 1000
      maxEntryBytes: 20971520
      maxExpandedBytes: 52428800
    presentation:
      maxBytes: 20971520
      maxEntries: 5000
      maxEntryBytes: 20971520
      maxExpandedBytes: 104857600
      maxSlides: 200
      maxTitleChars: 120
      thumbnailWidth: 144
      maxThumbnailPixels: 65536
      thumbnailConcurrency: 2
    delivery:
      maxEntries: 10000
      maxTotalBytes: 209715200
    download:
      secretEnv: AGENTKIT_DOWNLOAD_SECRET
      minSecretLength: 32
  workspace:
    probe:
      intervalSeconds: 30.0
      fullIntervalSeconds: 300.0
      timeoutSeconds: 15.0
      retryAttempts: 2
      retryDelaySeconds: 0.25
      failureCooldownSeconds: 60.0
      command:
      - sh
      - -c
      - ':'
      storagePython: '{gateway_python}'
      runtimeCommands:
      - - '{gateway_python}'
        - -c
        - import agentscope, mcp; import sys; print(sys.version)
      - - sh
        - -c
        - command -v curl >/dev/null && command -v rg >/dev/null
    lock:
      leaseSeconds: 90.0
      waitTimeoutSeconds: 30.0
    files:
      win: false
      # Windows Agent 设置 win: true，填写挂载同一 NAS 的 Linux 文件服务地址。
      # endpoint: http://nas-files.internal:38093
      tokenEnv: AGENTKIT_NAS_FILE_TOKEN
      timeoutSeconds: 60.0
    readGuard:
      sampleBytes: 4096
      controlByteRatioThreshold: 0.3
    runtime:
      root: /mnt/company-nas/agentkit
      mode: pks
      sandbox:
        domain: 127.0.0.1:8090
        apiKeyEnv: OPEN_SANDBOX_API_KEY
        protocol: http
        image: python:3.11-slim
        useServerProxy: true
        inputsReadOnly: true
        requestTimeoutSeconds: 600
        readyTimeoutSeconds: 60
        timeoutSeconds: 3600
        bootstrapTimeoutSeconds: 600
        ttlSeconds: 900
        sweepIntervalSeconds: 60
        renewIntervalSeconds: 60
        gatewayPort: 5600
        gatewayTmpDir: /dev/shm
        gatewayHome: /root/.agentscope
        instructions: 当前执行环境为企业沙箱，工作根目录：{workdir}。
        bootstrapCommands:
        - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates ripgrep && update-ca-certificates && rm -rf /var/lib/apt/lists/*
        - curl -LsSf https://astral.sh/uv/{uv_version}/install.sh | env UV_INSTALL_DIR=/usr/local/bin INSTALLER_NO_MODIFY_PATH=1 sh
        - uv venv {gateway_venv}
        - uv pip install --python {gateway_python} {pip_requirements}
        - uv pip install --python {gateway_python} --no-deps 'agentscope==2.0.12'
        maxSkillBytes: 52428799
        env: {}
        resource: {cpu: '1', memory: 1Gi}
        entrypoint: [tail, '-f', /dev/null]
        extraPip: [docstring-parser, jinja2, aiofiles, python-frontmatter, tree-sitter, tree-sitter-bash, pypdf]
  model:
    catalog:
      models:
      - key: company
        displayName: Company model
        model: company-model
        credentialType: openai_credential
        modelClass: openai_chat
        baseUrl: https://model.example.com/v1
        apiKeyEnv: AGENTKIT_MODEL_API_KEY
        parameters: {}
    selection:
      defaultKey: company
      allowOverride: true
      allowedKeys:
      - company
  admin:
    pagination:
      defaultPageSize: 20
      maxPageSize: 100
  logging:
    level: INFO
    format: json
    textPattern: '{time} [{level}] {package}.{function} - {message}'  # format: text 时生效。
    textDateFormat: null  # 文本日志时间默认 UTC ISO 8601，也可填 '%Y-%m-%d %H:%M:%S %z'。
    directory: null  # 填服务进程可写的绝对目录，例如 /var/log/agentkit；null 仅输出 stdout。
    accessLog: true
  client:
    postgres:
      connection:
        mode: key
        host: pg.company.internal
        port: 5432
        database: agentscope
        username: agentkit
        password: ''  # key 模式在 Nacos 填写实际密码；生产限制本配置的读写权限。
        connectTimeoutSeconds: 10.0
        sslMode: verify-full
        sslCaFile: /etc/agentkit/certs/pg-ca.pem
        # cyberark 模式删除 password，并填写以下 CCP REST 配置：
        # cyberark:
        #   endpoint: https://ccp.company.internal/AIMWebService/api/Accounts
        #   appId: agentkit
        #   safe: database
        #   objectName: postgres-agentkit
        #   folder: Root
        #   timeoutSeconds: 10.0
        #   tlsCaFile: /etc/agentkit/certs/ccp-ca.pem
        #   clientCertFile: /etc/agentkit/certs/ccp-client.pem
        #   clientKeyFile: /etc/agentkit/certs/ccp-client.key
      pool:
        size: 10
        maxOverflow: 10
    kafka:
      connection:
        deploymentMode: cluster
        bootstrapServers:
        - 127.0.0.1:9092
        topicPrefix: egis-agentkit
        consumerGroup: egis-agentkit-wakeup-v1
      topics:
        partitions: 8
        replicationFactor: 1
      transport:
        bufferSize: 256
        startupTimeoutSeconds: 45.0
        pollTimeoutMilliseconds: 200
        fullBufferBackoffSeconds: 0.05
        retryBackoffSeconds: 0.5
        expirySweepSeconds: 60.0
        partitionFetchMaxBytes: 1048576
        fetchMaxBytes: 4194304
      broadcast:
        inlineMaxBytes: 524288
        maxBytes: 33554432
        maxKeyBytes: 65536
        payloadTtlSeconds: 3600
        storageTimeoutSeconds: 30.0
    redis:
      host: 127.0.0.1
      port: 6380
      db: 0
      passwordEnv: null  # Redis 启用密码时填写服务进程的环境变量名。
      maxConnections: 128
      connectTimeoutSeconds: 3.0
      socketTimeoutSeconds: 5.0
      retentionSeconds: 86400
    nacos:
      refresh:
        intervalSeconds: 10.0
        failureIntervalSeconds: 10.0
    tracing:
      enabled: true
      endpoint: http://127.0.0.1:6006/v1/traces
      projectName: egis-agentkit
      httpProjectName: egis-agentkit-http
      serviceName: egis-agentkit
      sampleRatio: 1.0
      exportTimeoutSeconds: 10.0
      shutdownTimeoutMilliseconds: 5000
      maxQueueSize: 2048
      maxExportBatchSize: 512
      scheduleDelayMilliseconds: 5000
      headers: {}
